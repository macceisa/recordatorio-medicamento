<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Medicinas</title>
<style>
  :root{
    --bg:#0f1b1c;
    --panel:#132628;
    --panel-2:#16302f;
    --teal:#3ea89a;
    --teal-bright:#5fd6c4;
    --amber:#e0a458;
    --danger:#e05858;
    --text:#eaf3f1;
    --text-dim:#9db5b1;
    --line:#20393a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(62,168,154,0.14), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .display{ font-family: Georgia, 'Times New Roman', serif; }
  header{ max-width:520px; margin:0 auto 22px; }
  .eyebrow{ font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--teal-bright); margin:0 0 6px; font-weight:600; }
  h1{ font-size:28px; margin:0 0 4px; font-weight:600; }
  .sub{ color:var(--text-dim); font-size:14px; margin:0; }
  .clock-panel{ max-width:520px; margin:0 auto 20px; background:linear-gradient(160deg, var(--panel-2), var(--panel)); border:1px solid var(--line); border-radius:18px; padding:22px; display:flex; justify-content:space-between; align-items:center; }
  #clock{ font-size:34px; font-weight:300; letter-spacing:0.02em; font-variant-numeric:tabular-nums; }
  .next-dose{ text-align:right; }
  .next-dose .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:4px; }
  .next-dose .name{ font-size:16px; font-weight:600; color:var(--teal-bright); }
  .next-dose .time{ font-size:13px; color:var(--text-dim); }
  .status-bar{ max-width:520px; margin:0 auto 22px; display:flex; gap:10px; align-items:center; font-size:13px; color:var(--text-dim); padding:0 4px; }
  .dot{ width:8px;height:8px;border-radius:50%; background:var(--text-dim); flex-shrink:0; }
  .dot.on{background:var(--teal-bright); box-shadow:0 0 8px var(--teal-bright);}
  button.enable{ margin-left:auto; background:var(--teal); color:#04201d; border:none; padding:8px 14px; border-radius:20px; font-weight:600; font-size:12px; cursor:pointer; }
  button.enable:hover{background:var(--teal-bright);}
  .timeline{ max-width:520px; margin:0 auto; position:relative; padding-left:28px; }
  .timeline::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .dose{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; transition:border-color .2s, background .2s; }
  .dose::before{ content:""; position:absolute; left:-23px; top:22px; width:12px;height:12px; border-radius:50%; background:var(--bg); border:2px solid var(--text-dim); }
  .dose.taken{ opacity:0.5; }
  .dose.taken::before{ background:var(--teal); border-color:var(--teal); }
  .dose.due{ border-color:var(--amber); background:linear-gradient(160deg, #2a2214, var(--panel)); }
  .dose.due::before{ background:var(--amber); border-color:var(--amber); box-shadow:0 0 10px var(--amber); }
  .dose-info .time{ font-size:12px; color:var(--teal-bright); letter-spacing:0.06em; margin-bottom:3px; font-weight:600; }
  .dose-info .med{ font-size:16px; font-weight:600; }
  .dose-actions{ display: flex; gap: 8px; flex-direction: column; }
  .dose-actions button{ background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:7px 12px; border-radius:10px; font-size:12px; cursor:pointer; white-space: nowrap; }
  .dose-actions button:hover{ border-color:var(--teal); color:var(--teal-bright); }
  .dose-actions .delete-btn{ border-color: rgba(224, 88, 88, 0.3); color: rgba(224, 88, 88, 0.8); }
  .dose-actions .delete-btn:hover{ border-color:var(--danger); color:var(--danger); background: rgba(224, 88, 88, 0.1); }
  .dose.taken .dose-actions button:not(.delete-btn){ border-color:var(--teal); color:var(--teal); }
  .add-panel{ max-width:520px; margin:30px auto 20px; background:var(--panel); border:1px dashed var(--line); border-radius:14px; padding:20px; }
  .add-panel h3{ margin: 0 0 15px 0; color: var(--teal-bright); font-size: 16px; }
  .add-form{ display: flex; flex-wrap: wrap; gap: 10px; }
  .add-form input{ background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 10px; font-size: 14px; }
  .add-form input[type="text"]{ flex: 1; min-width: 150px; }
  .add-form input[type="time"]{ width: 110px; }
  .add-form button{ background: var(--teal); color: #04201d; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; margin-top: 5px; }
  .add-form button:hover{ background: var(--teal-bright); }
  footer{ max-width:520px; margin:10px auto 0; text-align:center; font-size:12px; color:var(--text-dim); }
  footer button{ background:none; border:1px solid var(--line); color:var(--text-dim); padding:8px 16px; border-radius:20px; font-size:12px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Recordatorio diario</p>
  <h1 class="display">Mis Medicinas</h1>
  <p class="sub">Te avisaré por voz a cada hora indicada. Si no la tomas, te recordaré cada 3 minutos.</p>
</header>

<div class="clock-panel">
  <div id="clock">--:--</div>
  <div class="next-dose">
    <div class="label">Próxima toma</div>
    <div class="name" id="next-name">—</div>
    <div class="time" id="next-time">—</div>
  </div>
</div>

<div class="status-bar">
  <div class="dot" id="voice-dot"></div>
  <span id="voice-status">Voz no activada</span>
  <button class="enable" id="enable-btn">Activar voz</button>
</div>

<div class="timeline" id="timeline"></div>

<div class="add-panel">
  <h3>+ Agregar nueva medicina</h3>
  <div class="add-form">
    <input type="text" id="new-med-name" placeholder="Nombre de la medicina">
    <input type="time" id="new-med-time">
    <button id="add-med-btn">Agregar</button>
  </div>
</div>

<footer>
  <button id="reset-btn">Reiniciar marcas de hoy</button>
</footer>

<script>
let schedule = [];
let voiceEnabled = false;
let spokenToday = {};
let takenToday = {};
let lastReminded = {};

const todayKey = () => new Date().toISOString().slice(0,10);
const storageKey = 'spoken-' + todayKey();
const takenKey = 'taken-' + todayKey();
const scheduleKey = 'medicine-schedule';

async function storageGet(key) {
  try {
    if (window.storage && window.storage.get) {
      const s = await window.storage.get(key, false);
      return s ? JSON.parse(s.value) : null;
    } else {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : null;
    }
  } catch(e) { return null; }
}

async function storageSet(key, value) {
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(key, JSON.stringify(value), false);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch(e) {}
}

async function loadSchedule() {
  schedule = await storageGet(scheduleKey) || [
    { id:'metoprolol-am', time:'10:00', med:'Metoprolol' },
    { id:'espironolactona', time:'11:00', med:'Espironolactona' },
    { id:'alopurinol', time:'13:00', med:'Alopurinol' },
    { id:'metformina-glib', time:'19:00', med:'Metformina y Glibenclamida' },
    { id:'metoprolol-pm', time:'22:00', med:'Metoprolol' }
  ];
  schedule.sort((a, b) => toMinutes(a.time) - toMinutes(b.time));
}

async function loadState(){
  spokenToday = await storageGet(storageKey) || {};
  takenToday = await storageGet(takenKey) || {};
}

async function saveSpoken(){ await storageSet(storageKey, spokenToday); }
async function saveTaken(){ await storageSet(takenKey, takenToday); }
async function saveSchedule(){ await storageSet(scheduleKey, schedule); }

function toMinutes(hhmm){
  if(!hhmm) return 9999;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

// --- FUNCIÓN DE VOZ MEJORADA PARA CELULAR ---
function speak(text){
  if(!('speechSynthesis' in window)) return;
  
  // Cancelar cualquier voz anterior
  speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-MX';
  utter.rate = 0.95;
  utter.pitch = 1;
  
  // Buscar la voz EN EL MOMENTO EXACTO en que va a hablar
  // (Esto soluciona el problema de los celulares que tardan en cargar las voces)
  let availableVoices = speechSynthesis.getVoices();
  let esVoice = availableVoices.find(v => v.lang === 'es-MX') || 
                availableVoices.find(v => v.lang === 'es-ES') || 
                availableVoices.find(v => v.lang === 'es-US') ||
                availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
                
  if(esVoice) {
    utter.voice = esVoice;
  }
  
  // Un pequeño truco para celulares: a veces necesitan un micro-retraso 
  // después de cancelar para poder volver a hablar.
  setTimeout(() => {
    speechSynthesis.speak(utter);
  }, 100);
}

function announce(dose){
  speak(`Es hora de tomar tu medicina. ${dose.med}, programado para las ${dose.time}.`);
}

function render(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:false});

  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';

  let next = null;
  schedule.forEach(d => {
    const dMin = toMinutes(d.time);
    if(!takenToday[d.id] && dMin >= nowMin && !next) next = d;
  });
  if(!next){
    next = schedule.find(d => !takenToday[d.id]) || null;
  }

  schedule.forEach(d => {
    const dMin = toMinutes(d.time);
    const isTaken = !!takenToday[d.id];
    const isDue = !isTaken && dMin <= nowMin;

    const el = document.createElement('div');
    el.className = 'dose' + (isTaken ? ' taken' : '') + (isDue ? ' due' : '');
    
    const actionsHTML = isTaken 
      ? `<button class="mark-btn" data-id="${d.id}">Tomada ✓</button>
         <button class="delete-btn" data-id="${d.id}">Eliminar</button>`
      : `<button class="mark-btn" data-id="${d.id}">Marcar tomada</button>
         <button class="delete-btn" data-id="${d.id}">Eliminar</button>`;

    el.innerHTML = `
      <div class="dose-info">
        <div class="time">${d.time} HRS</div>
        <div class="med">${d.med}</div>
      </div>
      <div class="dose-actions">
        ${actionsHTML}
      </div>
    `;
    timeline.appendChild(el);
  });

  document.querySelectorAll('.mark-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      takenToday[id] = !takenToday[id];
      await saveTaken();
      render();
    });
  });

  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      schedule = schedule.filter(d => d.id !== id);
      await saveSchedule();
      render();
    });
  });

  if(next){
    document.getElementById('next-name').textContent = next.med;
    document.getElementById('next-time').textContent = next.time + ' hrs';
  } else {
    document.getElementById('next-name').textContent = 'Todo tomado hoy';
    document.getElementById('next-time').textContent = '—';
  }
}

function checkAlarms(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const currentMinutes = nowMin;

  schedule.forEach(d => {
    const dMin = toMinutes(d.time);
    if(voiceEnabled && dMin <= currentMinutes && !takenToday[d.id]){
      if(!spokenToday[d.id]){
        announce(d);
        spokenToday[d.id] = true;
        lastReminded[d.id] = currentMinutes;
        saveSpoken();
        render();
      } else {
        const lastSpoke = lastReminded[d.id] || -999;
        if (currentMinutes - lastSpoke >= 3) {
          announce(d);
          lastReminded[d.id] = currentMinutes;
        }
      }
    }
  });
}

document.getElementById('enable-btn').addEventListener('click', () => {
  voiceEnabled = true;
  document.getElementById('voice-dot').classList.add('on');
  document.getElementById('voice-status').textContent = 'Voz activada';
  document.getElementById('enable-btn').textContent = 'Probar voz';
  // Forzar la carga de voces al presionar el botón (necesario en celulares)
  speechSynthesis.getVoices(); 
  speak('Aviso de voz activado. Te recordaré cada medicina a su hora.');
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  takenToday = {};
  spokenToday = {};
  lastReminded = {};
  await saveTaken();
  await saveSpoken();
  render();
});

document.getElementById('add-med-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('new-med-name');
  const timeInput = document.getElementById('new-med-time');
  
  if(nameInput.value.trim() === '' || timeInput.value === ''){
    alert('Por favor escribe el nombre y la hora de la medicina.');
    return;
  }

  const newMed = {
    id: 'med-' + Date.now(),
    time: timeInput.value,
    med: nameInput.value.trim()
  };

  schedule.push(newMed);
  schedule.sort((a, b) => toMinutes(a.time) - toMinutes(b.time));
  await saveSchedule();
  
  nameInput.value = '';
  timeInput.value = '';
  render();
});

(async function init(){
  // Cargar voces temprano por si el navegador las detecta rápido
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
  
  await loadSchedule();
  await loadState();
  render();
  setInterval(() => { render(); checkAlarms(); }, 15000);
})();
</script>

</body>
</html>
